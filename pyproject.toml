[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ubin"
version = "1.0.0"
description = "UBIN: universal binary access, authenticated security, resumable transfer, KRP, and lossless PNG carriers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "UBIN Project"}
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
ubin = "ubin.cli:main"

[project.urls]
Repository = "https://github.com/suryaganesh0509/UBIN"

[tool.setuptools.package-data]
ubin = ["py.typed"]
