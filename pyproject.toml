[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ubin"
version = "0.5.0"
description = "UBIN reference implementation: universal, lazy binary access for arbitrary files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "UBIN Project"}
]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
