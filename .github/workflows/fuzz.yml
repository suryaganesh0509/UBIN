name: Fuzz smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 4 * * 6"

permissions:
  contents: read

jobs:
  atheris-smoke:
    name: Atheris parser/KRP smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fuzz dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fuzz]"

      - name: Fuzz KRP
        run: python fuzz/fuzz_krp.py -runs=1500 -max_len=8192

      - name: Fuzz PNG parser
        run: python fuzz/fuzz_png_parser.py -runs=1000 -max_len=8192
