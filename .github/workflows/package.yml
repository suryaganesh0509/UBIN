name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    name: Build + clean install
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel into clean environment
        shell: bash
        run: |
          python -m venv /tmp/ubin-wheel-test
          /tmp/ubin-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/ubin-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/ubin-wheel-test/bin/python -c "import importlib.metadata, ubin; expected=importlib.metadata.version('ubin'); assert ubin.__version__ == expected; print('UBIN wheel OK:', ubin.__version__)"
          /tmp/ubin-wheel-test/bin/ubin --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: ubin-distributions
          path: dist/
          if-no-files-found: error

  artifact-roundtrip:
    name: Download + verify uploaded artifact
    needs: build-and-install
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: ubin-distributions
          path: dist/

      - name: Verify downloaded distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check dist/*

          python -m venv /tmp/ubin-artifact-test
          /tmp/ubin-artifact-test/bin/python -m pip install --upgrade pip
          /tmp/ubin-artifact-test/bin/python -m pip install dist/*.whl

          /tmp/ubin-artifact-test/bin/python -c "import importlib.metadata, ubin; expected=importlib.metadata.version('ubin'); assert ubin.__version__ == expected; print('Downloaded UBIN artifact OK:', ubin.__version__)"
          /tmp/ubin-artifact-test/bin/ubin --version
