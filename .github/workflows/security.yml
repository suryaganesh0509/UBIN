name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    name: Bandit + pip-audit + Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,security]"

      - name: Ruff static checks
        run: ruff check src tests fuzz

      - name: Bandit security scan
        run: bandit -r src/ubin -ll -ii -f json -o bandit-report.json

      - name: Dependency vulnerability audit
        run: pip-audit -f json -o pip-audit-report.json

      - name: Upload Python security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Semgrep scan
        run: semgrep scan --config auto --error --json --output semgrep-report.json src/ubin

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
